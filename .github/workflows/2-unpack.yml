name: unpack-site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repo contents with the site
        run: |
          set -e
          Z=$(ls *deploy-site.zip 2>/dev/null | head -1 || true)
          if [ -z "$Z" ]; then echo "no zip, nothing to do"; exit 0; fi
          rm -rf /tmp/site && mkdir /tmp/site && unzip -q "$Z" -d /tmp/site
          git rm -rq --ignore-unmatch .
          rm -rf ./* .github
          cp -r /tmp/site/. .
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unpack Converter site"
          git push
